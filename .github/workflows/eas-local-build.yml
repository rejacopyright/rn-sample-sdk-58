name: EAS Local Build

# Runs `eas build --local` on a GitHub macOS runner, so it does NOT use EAS cloud build quota.
# Needs an EXPO_TOKEN secret (expo.dev -> Account Settings -> Access Tokens), added in
# GitHub: Settings -> Secrets and variables -> Actions -> New repository secret.
# Run it from the "Actions" tab -> "EAS Local Build" -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile from eas.json
        type: choice
        default: development-simulator
        options:
          - development-simulator
          - development
          - preview
          - production
      platform:
        description: Platform to build
        type: choice
        default: ios
        options:
          - ios
          - android

jobs:
  build:
    # iOS needs macOS; Android can run on the cheaper Linux runner.
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 90

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        if: inputs.platform == 'ios'
        with:
          xcode-version: latest-stable

      - uses: actions/setup-java@v4
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: 17

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # eas build --local needs fastlane for iOS
      - name: Ensure fastlane is available
        if: inputs.platform == 'ios'
        run: command -v fastlane || brew install fastlane

      - name: Build locally with EAS
        run: |
          if [ "${{ inputs.platform }}" = "ios" ]; then
            EXT="tar.gz"
          elif [ "${{ inputs.profile }}" = "production" ]; then
            EXT="aab" # production on Android defaults to an app bundle
          else
            EXT="apk"
          fi
          bunx eas-cli build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/build-output.$EXT"

      - uses: actions/upload-artifact@v4
        with:
          name: eas-local-${{ inputs.platform }}-${{ inputs.profile }}
          path: build-output.*
          retention-days: 7
