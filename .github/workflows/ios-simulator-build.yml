name: iOS Simulator Build

# Manual only, so macOS runner minutes are not spent on every push.
# Run it from the GitHub "Actions" tab -> "iOS Simulator Build" -> "Run workflow".
on:
  workflow_dispatch:

jobs:
  build:
    # macOS runner image that ships a recent Xcode (SDK 58 needs Xcode 26.4+).
    # If this label is unavailable, check the current list of GitHub-hosted runners.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ios/ is gitignored (Continuous Native Generation), so generate it here
      - name: Prebuild iOS project
        run: bunx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: pod install
        working-directory: ios

      - name: Build for simulator (Debug, development client)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Zip the .app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/app-simulator.zip" ./*.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: app-simulator.zip
          retention-days: 7
